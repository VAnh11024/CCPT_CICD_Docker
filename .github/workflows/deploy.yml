name: Build and Push Spring Boot to Docker Hub

# Kích hoạt workflow mỗi khi có code mới được Push lên nhánh 'main'
on:
  push:
    branches:
      - main

jobs:
  build-and-push-docker-image:
    runs-on: ubuntu-latest

    steps:
      # 1. Action lấy code từ Github (Robot Checkout)
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. Action Đăng nhập Docker Hub (Robot Docker Login)
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Cài đặt Docker Buildx (Khuyến nghị đi kèm để build image tốt hơn)
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # 3. Action Đóng gói & Đẩy Image (Robot Build and push Docker images)
      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          # Tự động build từ Dockerfile và gắn tag
          # LƯU Ý: Thay đổi 'duanjava' thành tên bạn muốn
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/duanjava:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/duanjava:${{ github.sha }}
